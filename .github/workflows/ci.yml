name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI has no model API keys and no ~/.forge; the release check must pass
      # entirely on local, deterministic verification.
      FORGE_RUNTIME: fake
      FORGE_HOME: ${{ runner.temp }}/forge-home
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --prefix desktop

      - name: Release verification
        run: bash scripts/release-check.sh
