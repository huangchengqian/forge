name: Feature request
description: Suggest an idea for Forge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check existing issues and the
        roadmap in `ROADMAP.md` — the idea may already be tracked.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to accomplish, and what is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Forge do? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
